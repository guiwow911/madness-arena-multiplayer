<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暴力迪吧联合计划 · 联机版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#101018; color:#ddd; font-family:"Microsoft YaHei","Segoe UI",sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .toolbar {
    display:flex; align-items:center; gap:10px; padding:8px 16px;
    background:#1a1a28; border-bottom:1px solid #2c2c40; flex:0 0 auto; flex-wrap:wrap;
  }
  .toolbar label { font-size:13px; color:#9aa; }
  .toolbar input[type=text] {
    background:#0e0e18; color:#ddd; border:1px solid #333; padding:4px 8px; border-radius:4px; font-size:13px; width:140px;
  }
  .toolbar input[type=color] { background:#0e0e18; border:1px solid #333; padding:2px; border-radius:4px; }
  .btn {
    border:1px solid #3a3a55; background:#23233a; color:#ccc; padding:5px 12px;
    border-radius:4px; cursor:pointer; font-size:13px;
  }
  .btn:hover { background:#2c2c48; }
  .btn.primary { background:#4a6cf7; border-color:#5a7cff; color:#fff; }
  .btn.primary:hover { background:#5b7bff; }
  .btn.red { background:#7a2a2a; border-color:#9a3a3a; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .status-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .status-dot.on { background:#3f9; box-shadow:0 0 6px #3f9; }
  .status-dot.off { background:#f44; }
  #connStatus { font-size:13px; color:#9aa; }
  #peerCount { font-size:13px; color:#7cf; }
  .peer-panel {
    flex:0 0 auto; background:#16161f; border-bottom:1px solid #2c2c40;
    padding:6px 16px; min-height:0;
  }
  .peer-chip {
    display:inline-flex; align-items:center; gap:6px; background:#23233a;
    border:1px solid #3a3a55; padding:3px 10px; border-radius:16px; font-size:12px; margin:2px 6px 2px 0;
  }
  .peer-chip.me { border-color:#4a6cf7; color:#8aa4ff; }
  .peer-chip .dot { width:8px; height:8px; border-radius:50%; background:#4a6cf7; }
  .game-wrap { flex:1 1 auto; position:relative; min-height:0; background:#000; }
  #ruffle-player { width:100%; height:100%; }
  #remotePlayers { position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .remote-player { position:absolute; display:flex; flex-direction:column; align-items:center; gap:3px; transform:translate(-50%,-100%); white-space:nowrap; }
  .remote-player .marker { width:12px; height:12px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 7px currentColor; }
  .remote-player .name { max-width:150px; overflow:hidden; text-overflow:ellipsis; padding:2px 6px; border-radius:3px; background:rgba(0,0,0,.78); color:#fff; font-size:12px; text-shadow:0 1px 2px #000; }
  .hint { position:absolute; bottom:8px; left:8px; color:#888; font-size:11px; z-index:5; }
</style>
</head>
<body>

<div class="toolbar">
  <label>昵称</label>
  <input type="text" id="nickname" value="玩家" maxlength="16">
  <button class="btn primary" id="btnConnect">连接服务器</button>
  <button class="btn red" id="btnDisconnect" disabled>断开</button>
  <span id="connStatus"><span class="status-dot off"></span>未连接</span>
  <span id="peerCount"></span>
  <span id="syncStatus" style="font-size:12px;color:#9aa"></span>
</div>

<div class="peer-panel"><span style="font-size:12px;color:#778">在线玩家：</span><span id="peerList"></span></div>

<div class="game-wrap">
  <div id="ruffle-player"></div>
  <div id="remotePlayers" aria-hidden="true"></div>
  <div class="hint">按 F 眼部激光 · 输入 zjpyyds 作弊码 · 其他人以彩色菱形标记显示</div>
</div>

<script src="ruffle/ruffle.js"></script>
<script>
(function () {
  'use strict';
  let ws = null, connected = false, myId = null, myName = '玩家';
  const peers = new Map();
  const remoteStates = new Map();
  const GAME_WIDTH = 850, GAME_HEIGHT = 530;
  const $ = id => document.getElementById(id);
  // One fresh identity per page instance. sessionStorage can be cloned when a
  // tab is duplicated, which would merge two real players and make their
  // coordinates overwrite one another on the server.
  const sid = crypto.randomUUID ? crypto.randomUUID() :
    `${Date.now().toString(16)}-${Math.random().toString(16).slice(2)}-${Math.random().toString(16).slice(2)}`;

  function setStatus(on, text) {
    $('connStatus').innerHTML =
      '<span class="status-dot ' + (on ? 'on' : 'off') + '"></span>' + text;
  }

  // ---------- WebSocket ----------
  function getWsUrl() {
    const s = new URLSearchParams(location.search).get('server');
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const url = new URL(s ? (proto + s) : (proto + location.host));
    url.searchParams.set('sid', sid);
    return url.toString();
  }

  function connect() {
    if (connected) return;
    myName = $('nickname').value.trim() || '玩家';
    const url = getWsUrl();
    setStatus(false, '连接中…');
    try { ws = new WebSocket(url); }
    catch (e) { setStatus(false, '无法连接'); return; }

    ws.onopen = () => {
      connected = true;
      setStatus(true, '已连接');
      $('btnDisconnect').disabled = false;
      $('btnConnect').disabled = true;
      ws.send(JSON.stringify({ t: 'join', name: myName }));
      notifyGame({ t: 'conn', on: true });
    };
    ws.onmessage = ev => {
      if (typeof ev.data !== 'string') return;
      try { handleServer(JSON.parse(ev.data)); } catch (e) { console.warn('忽略无效服务器消息', e); }
    };
    ws.onclose = () => {
      connected = false;
      setStatus(false, '连接断开');
      $('btnDisconnect').disabled = true;
      $('btnConnect').disabled = false;
      myId = null; peers.clear(); renderPeers();
      notifyGame({ t: 'conn', on: false });
    };
    ws.onerror = () => { if (!connected) setStatus(false, '连接失败'); };
  }

  function handleServer(msg) {
    switch (msg.t) {
      case 'welcome':
        myId = msg.id;
        // 通知游戏已登录（触发 AS2 onLogin -> 显示HUD+置connected）
        authGame('zjNetLogin', [String(myId)]);
        break;
      case 'peers': peers.clear(); msg.list.forEach(p => peers.set(p.id, p)); renderPeers(); renderRemotePlayers(); break;
      case 'peerJoin': peers.set(msg.id, { id: msg.id, name: msg.name }); renderPeers(); renderRemotePlayers(); break;
      case 'peerLeave': peers.delete(msg.id); remoteStates.delete(msg.id); renderPeers(); renderRemotePlayers(); break;
      case 'state':
        if (msg.id !== myId && Number.isFinite(Number(msg.x)) && Number.isFinite(Number(msg.y))) {
          remoteStates.set(msg.id, { x: Number(msg.x), y: Number(msg.y) });
          renderRemotePlayers();
        }
        // 页面层直接显示服务器坐标，不依赖 Ruffle ExternalInterface。
        notifyGame(msg);
        break;
    }
  }

  function authGame(name, args) {
    const el = document.querySelector('ruffle-player');
    if (!el) return;
    try {
      if (typeof el[name] === 'function') { el[name].apply(el, args); return; }
    } catch (e) {}
    try {
      if (typeof el.callExternalInterface === 'function') {
        el.callExternalInterface(name, args.length === 1 ? args[0] : args);
      }
    } catch (e) {}
  }

  function renderPeers() {
    const list = $('peerList');
    list.replaceChildren();
    peers.forEach((p, id) => {
      if (id === myId) return;
      const chip = document.createElement('span');
      chip.className = 'peer-chip';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.backgroundColor = id % 3 === 0 ? '#55ccff' : id % 3 === 1 ? '#ffcc44' : '#66ff88';
      const name = document.createElement('span');
      name.textContent = p.name || ('P' + id);
      chip.append(dot, name);
      list.appendChild(chip);
    });
    if (!list.childElementCount) {
      const empty = document.createElement('span');
      empty.style.cssText = 'color:#666;font-size:12px';
      empty.textContent = '暂无其他人';
      list.appendChild(empty);
    }
    $('peerCount').textContent = myId !== null ? ('共 ' + (peers.size + 1) + ' 人') : '';
  }

  function renderRemotePlayers() {
    const layer = $('remotePlayers');
    const area = $('ruffle-player').getBoundingClientRect();
    if (!area.width || !area.height) return;
    // SWF stage is 850×530 and Ruffle uses scale=showAll, so preserve its
    // letterboxed content rectangle instead of stretching game coordinates.
    const scale = Math.min(area.width / GAME_WIDTH, area.height / GAME_HEIGHT);
    const offsetX = (area.width - GAME_WIDTH * scale) / 2;
    const offsetY = (area.height - GAME_HEIGHT * scale) / 2;
    const fragment = document.createDocumentFragment();
    remoteStates.forEach((pos, id) => {
      const peer = peers.get(id);
      if (!peer || id === myId) return;
      const color = id % 3 === 0 ? '#55ccff' : id % 3 === 1 ? '#ffcc44' : '#66ff88';
      const marker = document.createElement('div');
      marker.className = 'remote-player';
      marker.style.left = `${offsetX + Math.max(0, Math.min(GAME_WIDTH, pos.x)) * scale}px`;
      marker.style.top = `${offsetY + Math.max(0, Math.min(GAME_HEIGHT, pos.y)) * scale}px`;
      marker.style.color = color;
      const icon = document.createElement('span');
      icon.className = 'marker'; icon.style.backgroundColor = color;
      const label = document.createElement('span');
      label.className = 'name'; label.textContent = peer.name || `P${id}`;
      marker.append(icon, label);
      fragment.appendChild(marker);
    });
    layer.replaceChildren(fragment);
    const count = [...remoteStates.keys()].filter(id => id !== myId && peers.has(id)).length;
    $('syncStatus').textContent = count ? `已收到 ${count} 名玩家的位置` : '';
  }

  // ---------- 桥接：AS2 -> 页面 -> WebSocket ----------
  window.__as2Calls = 0;
  window.zjSocketSend = function (jsonStr) {
    window.__as2Calls = (window.__as2Calls || 0) + 1;
    if (ws && connected) { try { ws.send(jsonStr); } catch (e) {} }
  };
  // 页面 -> SWF（Ruffle 元素上的 addCallback 暴露可直接调用的属性）
  function notifyGame(msg) {
    const el = document.querySelector('ruffle-player');
    if (!el) return;
    const json = JSON.stringify(msg);
    try {
      // addCallback 把接口暴露为元素属性（源码 Mn 构造里定义了这些属性）
      if (typeof el.zjNetUpdate === 'function') { el.zjNetUpdate(json); return; }
    } catch (e) {}
    try {
      if (typeof el.callExternalInterface === 'function') {
        el.callExternalInterface('zjNetUpdate', json);
      }
    } catch (e) { /* SWF 未就绪忽略 */ }
  }

  // ---------- Ruffle ----------
  function init() {
    if (!window.RufflePlayer) { show('等待 Ruffle 加载…'); return; }
    const player = window.RufflePlayer.newest();
    const holder = $('ruffle-player');
    const p = player.createPlayer();
    p.config = {
      autoplay: 'on', backgroundColor: '#000000',
      letterbox: 'on', quality: 'high', scale: 'showAll',
      logLevel: 'debug',
      socketProxy: [
        { host: '127.0.0.1', port: 8082, proxyUrl: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/proxy?sid=' + encodeURIComponent(sid) }
      ],
      openUrlMode: 'deny', allowNetworking: 'all',
      allowScriptAccess: 'always'
    };
    holder.appendChild(p);
    // SWF 就绪后标记，并触发游戏内联机初始化
    p.addEventListener('loadedmetadata', () => {
      try { p.__ready = true; } catch (e) {}
    });
    // 加载联机版 SWF（同一路径，多玩家各开一个页面）
    p.load(location.origin + '/patched_online.swf');
    window.__p = p;
  }

  $('btnConnect').addEventListener('click', connect);
  $('btnDisconnect').addEventListener('click', () => { if (ws) ws.close(); });
  window.addEventListener('load', init);
  window.addEventListener('resize', renderRemotePlayers);
  window.__bridgeReady = true;
})();
</script>
</body>
</html>
